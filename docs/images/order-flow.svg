<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
  <title id="title">How Order Analyzer works</title>
  <desc id="desc">Enter retailer orders, save them locally, review product totals, and share a dispatch list. Firestore syncs shop data when online. Separately, upload an Amul spreadsheet to create vehicle and retailer summaries and export a CSV.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font-size: 27px; font-weight: 750; }
      .sub { fill: #64748b; font-size: 15px; }
      .label { fill: #0f172a; font-size: 17px; font-weight: 700; }
      .body { fill: #64748b; font-size: 13px; }
      .small { fill: #475569; font-size: 13px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1080" height="590" rx="28" fill="#fff9f2"/>
  <text x="44" y="57" class="heading">From retailer orders to a ready-to-use report</text>
  <text x="44" y="84" class="sub">Two useful workflows, with daily shop orders kept separate from Amul spreadsheet analysis.</text>

  <!-- Daily orders workflow -->
  <text x="44" y="132" fill="#2563eb" font-size="12" font-weight="800" letter-spacing="1.4">DAILY PRODUCT ORDERS</text>
  <g filter="url(#shadow)">
    <rect x="44" y="151" width="215" height="108" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="286" y="151" width="215" height="108" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="528" y="151" width="215" height="108" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="770" y="151" width="266" height="108" rx="18" fill="#ffffff" stroke="#dbeafe"/>
  </g>
  <g text-anchor="middle">
    <circle cx="78" cy="185" r="16" fill="#dbeafe"/><text x="78" y="191" fill="#2563eb" font-size="16" font-weight="800">1</text>
    <text x="151" y="191" class="label">Set up your shop</text>
    <text x="151" y="218" class="body">Products + retailers</text>
    <circle cx="320" cy="185" r="16" fill="#d1fae5"/><text x="320" y="191" fill="#059669" font-size="16" font-weight="800">2</text>
    <text x="393" y="191" class="label">Enter orders</text>
    <text x="393" y="218" class="body">Choose retailer + quantities</text>
    <circle cx="562" cy="185" r="16" fill="#fef3c7"/><text x="562" y="191" fill="#d97706" font-size="16" font-weight="800">3</text>
    <text x="635" y="191" class="label">Review totals</text>
    <text x="635" y="218" class="body">Quantities + in-app billing</text>
    <circle cx="805" cy="185" r="16" fill="#ede9fe"/><text x="805" y="191" fill="#7c3aed" font-size="16" font-weight="800">4</text>
    <text x="903" y="191" class="label">Share dispatch list</text>
    <text x="903" y="218" class="body">Product names + quantities</text>
  </g>

  <g fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round">
    <path d="M260 205h22"/><path d="M502 205h22"/><path d="M744 205h22"/>
  </g>
  <g fill="#2563eb">
    <circle r="5"><animate attributeName="cx" values="261;281;261" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="205;205;205" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="5"><animate attributeName="cx" values="503;523;503" dur="1.6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="205;205;205" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle r="5"><animate attributeName="cx" values="745;765;745" dur="1.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="205;205;205" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Storage/sync note -->
  <rect x="44" y="279" width="992" height="65" rx="16" fill="#eaf3ff"/>
  <circle cx="75" cy="311" r="13" fill="#2563eb"/>
  <path d="M69 311a6 6 0 0 1 11-3m1-5v5h-5M81 311a6 6 0 0 1-11 3m-1 5v-5h5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="101" y="307" class="label" font-size="15">Offline-ready</text>
  <text x="101" y="328" class="body">Orders save on your phone; shop data syncs through Firebase when online.</text>
  <rect x="777" y="295" width="232" height="33" rx="16.5" fill="#ffffff"/>
  <circle cx="796" cy="311.5" r="5" fill="#059669"><animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="811" y="316" class="small">Same shop account on both phones</text>

  <!-- Separate Amul workflow -->
  <text x="44" y="391" fill="#d97706" font-size="12" font-weight="800" letter-spacing="1.4">AMUL MILK ORDERS · SEPARATE WORKFLOW</text>
  <g filter="url(#shadow)">
    <rect x="44" y="410" width="286" height="105" rx="18" fill="#ffffff" stroke="#fde68a"/>
    <rect x="397" y="410" width="286" height="105" rx="18" fill="#ffffff" stroke="#fde68a"/>
    <rect x="750" y="410" width="286" height="105" rx="18" fill="#ffffff" stroke="#fde68a"/>
  </g>
  <g text-anchor="middle">
    <text x="187" y="453" class="label">Choose a spreadsheet</text>
    <text x="187" y="481" class="body">Excel (.xlsx, .xls) or CSV</text>
    <text x="540" y="453" class="label">Analyze the orders</text>
    <text x="540" y="481" class="body">Vehicle + retailer summaries</text>
    <text x="893" y="453" class="label">Export a report</text>
    <text x="893" y="481" class="body">Download a summary CSV</text>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <path d="M331 463h61"/><path d="M684 463h61"/>
  </g>
  <g fill="#d97706">
    <circle r="5"><animate attributeName="cx" values="333;390;333" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="463;463;463" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="5"><animate attributeName="cx" values="686;743;686" dur="2.4s" begin=".8s" repeatCount="indefinite"/><animate attributeName="cy" values="463;463;463" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="540" y="560" text-anchor="middle" class="body">Amul spreadsheet analysis is local and does not mix with synced daily shop orders.</text>
</svg>
